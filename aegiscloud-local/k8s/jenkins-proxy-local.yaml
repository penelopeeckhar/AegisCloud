apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-proxy-config
  namespace: ivolve
data:
  default.conf: "map $http_upgrade $connection_upgrade {\n    default upgrade;\n \
    \   ''      close;\n}\n\nserver {\n    listen 8080;\n    server_name _;\n\n  \
    \  location / {\n        proxy_pass http://10.0.2.15:8080;\n        proxy_http_version\
    \ 1.1;\n        proxy_redirect off;\n\n        proxy_set_header Host $http_host;\n\
    \        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For\
    \ $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto https;\n\
    \        proxy_set_header X-Forwarded-Host $host;\n        proxy_set_header X-Forwarded-Port\
    \ 443;\n\n        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header\
    \ Connection $connection_upgrade;\n\n        proxy_connect_timeout 10s;\n    \
    \    proxy_send_timeout 90s;\n        proxy_read_timeout 90s;\n        proxy_max_temp_file_size\
    \ 0;\n    }\n}\n"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jenkins-proxy-policy
  namespace: ivolve
spec:
  podSelector:
    matchLabels:
      app: jenkins-proxy
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - ipBlock:
        cidr: 10.0.0.0/16
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - ipBlock:
        cidr: 10.0.2.15/32
    ports:
    - protocol: TCP
      port: 8080
